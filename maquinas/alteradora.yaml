# MT alteradora: ordena la cadena w en {a, b, c}* (ordenamiento por insercion)
mt:
  states: [q0, q1, q2, q3, q4, q5, qf]
  input_alphabet: [a, b, c]
  tape_alphabet: [a, b, c, B]
  initial_state: q0
  accept_states: [qf]
  transitions:
    - {state: q0, read: [a, B], write: [a, a], move: R, next: q0}
    - {state: q0, read: [b, B], write: [b, b], move: R, next: q0}
    - {state: q0, read: [c, B], write: [c, c], move: R, next: q0}
    - {state: q0, read: [a, a], write: [a, a], move: R, next: q0}
    - {state: q0, read: [b, a], write: [b, b], move: R, next: q0}
    - {state: q0, read: [c, a], write: [c, c], move: R, next: q0}
    - {state: q0, read: [a, b], write: [a, b], move: L, next: q1}
    - {state: q0, read: [b, b], write: [b, b], move: R, next: q0}
    - {state: q0, read: [c, b], write: [c, c], move: R, next: q0}
    - {state: q0, read: [a, c], write: [a, c], move: L, next: q1}
    - {state: q0, read: [b, c], write: [b, c], move: L, next: q1}
    - {state: q0, read: [c, c], write: [c, c], move: R, next: q0}
    - {state: q0, read: [B, B], write: [B, B], move: L, next: q5}
    - {state: q0, read: [B, a], write: [B, B], move: L, next: q5}
    - {state: q0, read: [B, b], write: [B, B], move: L, next: q5}
    - {state: q0, read: [B, c], write: [B, B], move: L, next: q5}
    - {state: q1, read: [b, a], write: [a, a], move: L, next: q2}
    - {state: q1, read: [c, a], write: [a, a], move: L, next: q2}
    - {state: q1, read: [c, b], write: [b, b], move: L, next: q2}
    - {state: q2, read: [B, a], write: [B, B], move: R, next: q0}
    - {state: q2, read: [a, a], write: [a, a], move: R, next: q0}
    - {state: q2, read: [b, a], write: [b, a], move: R, next: q3}
    - {state: q2, read: [c, a], write: [c, a], move: R, next: q3}
    - {state: q2, read: [B, b], write: [B, B], move: R, next: q0}
    - {state: q2, read: [a, b], write: [a, a], move: R, next: q0}
    - {state: q2, read: [b, b], write: [b, b], move: R, next: q0}
    - {state: q2, read: [c, b], write: [c, b], move: R, next: q3}
    - {state: q3, read: [a, b], write: [a, b], move: L, next: q4}
    - {state: q3, read: [a, c], write: [a, c], move: L, next: q4}
    - {state: q3, read: [b, c], write: [b, c], move: L, next: q4}
    - {state: q4, read: [a, a], write: [a, a], move: L, next: q2}
    - {state: q4, read: [b, b], write: [b, b], move: L, next: q2}
    - {state: q5, read: [a, B], write: [B, a], move: L, next: q5}
    - {state: q5, read: [b, B], write: [B, b], move: L, next: q5}
    - {state: q5, read: [c, B], write: [B, c], move: L, next: q5}
    - {state: q5, read: [B, B], write: [B, B], move: R, next: qf}
  inputs:
    - "cabca"
    - "bcaab"
    - "ccbbaa"
    - "abacbc"
